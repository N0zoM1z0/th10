name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/ci.py --base "$TH10_CHECK_BASE"
        env:
          TH10_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
